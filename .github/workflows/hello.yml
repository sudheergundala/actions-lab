name: hello

on: 
  push:
    branches: [main]
    paths: [".github/workflows/hello.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
      - run: echo "Hello from the feature branch"
      - run: echo "Second commit on the branch"
