name: hello

on: 
  push:
    branches: [main]
    paths: [".github/workflows/hello.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:


jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
      - run: echo "Hello from the feature branch"
      - run: echo "Second commit on the branch"
