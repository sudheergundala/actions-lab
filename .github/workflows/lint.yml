name: lint

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint all workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color