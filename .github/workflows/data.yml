name: data
on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Make the build fail on purpose"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/data.yml"

jobs:
    build:
      runs-on: ubuntu-latest
      outputs:
        version: ${{ steps.build.outputs.version }}
      steps:
        - name: Build
          id: build
          env:
            SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          run: |
            set -u
            if [ "$SIMULATE_FAILURE" = "true" ]; then
              echo "Simulating a build failure"
              exit 1
            fi
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Build version $VERSION"
        - name: Notify on failure
          if: failure()
          run: echo "Build failed in run $GITHUB_RUN_NUMBER, someone should look"

    deploy:
      runs-on: ubuntu-latest
      needs: build
      if: github.ref == 'refs/heads/main'
      steps:
        - name: Deploy
          env:
            APP_NAME: ${{ vars.APP_NAME }}
            VERSION: ${{ needs.build.outputs.version }}
            ACTOR: ${{ github.triggering_actor }}
            COMMIT: ${{ github.sha }}
          run: |
            set -u
            echo "Deploying $APP_NAME version $VERSION"
            {
            echo "## Deployed $APP_NAME"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Commit | \`${COMMIT:0:7}\` |"
            echo "| Triggered by | $ACTOR |"
            } >> "$GITHUB_STEP_SUMMARY"