name: data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/data.yml"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        id: build
        run: |
          set -u
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built version $VERSION"
      - name: Deploy (env variable)
        run: echo "Deploying version $VERSION"
      - name: Deploy (step output)
        run: echo "Deploying version ${{steps.build.outputs.version}} for ${github.event_name}"
