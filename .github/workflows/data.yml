name: data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/data.yml"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: |
          set -u
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Built version $VERSION"
      - name: Deploy
        run: echo "Deploying version $VERSION"
