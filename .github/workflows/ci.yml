name: ci
on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: services/python-svc
    steps:
      - uses: actions/checkout@v5
      
      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: install dependencies exactly as locked
        run: uv sync --locked

      - name: Show the python version
        run: uv run python --version

      - name: Run tests
        run: uv run pytest -q


  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-svc

    steps:
      - uses: actions/checkout@v5

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: services/node-svc/.nvmrc

      - name: Install Dependencies exactly as locked
        run: npm ci

      - name: Show the Node version
        run: node --version

      - name: Run tests
        run: npm test


  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/java-svc
    steps:
      - uses: actions/checkout@v5

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show JDK version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Show Maven and the local repository before the build
        run: |
          mvn -version
          du -sh ~/.m2/repository 2>/dev/null || echo "$HOME/.m2/repository does not exist yet"

      - name: Build Test and Package
        run: mvn -B package

      - name: Checksum the JAR
        run: sha256sum target/java-svc-0.1.0-SNAPSHOT.jar

      - name: Show the local repository after the build
        run: du -sh ~/.m2/repository
      
      - name: Upload the JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-svc-jar
          path: services/java-svc/target/java-svc-0.1.0-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: services/java-svc/target/surefire-reports
          retention-days: 7
          if-no-files-found: error

  java-verify:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - name: Download the JAR built by java job
        uses: actions/download-artifact@v4
        with:
          name: java-svc-jar
          path: dist

      - name: Inspect the JAR
        run: |
          ls -la dist
          sha256sum dist/*.jar
          unzip -l dist/*.jar