name: ci
on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash


jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: services/python-svc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: install dependencies exactly as locked
        run: uv sync --locked

      - name: Show the python version
        run: uv run python --version

      - name: Run tests
        run: uv run pytest -q --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-report-${{ matrix.python }}
          path: services/python-svc/reports/junit.xml
          retention-days: 7
          if-no-files-found: error

  python-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-test-only
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d orders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/python-svc
    env:
      DATABASE_URL: postgresql://app:app-test-only@localhost:5432/orders
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Run tests against postgres
        run: uv run pytest -q -rs  

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-svc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/node-svc/.nvmrc

      - name: Install Dependencies exactly as locked
        run: npm ci

      - name: Show the Node version
        run: node --version

      - name: Run tests
        run: |
          mkdir -p reports
          npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node test reports
          path: services/node-svc/reports/junit.xml
          retention-days: 7
          if-no-files-found: error

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/java-svc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show JDK version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Show Maven and the local repository before the build
        run: |
          mvn -version
          du -sh ~/.m2/repository 2>/dev/null || echo "$HOME/.m2/repository does not exist yet"

      - name: Build Test and Package
        run: mvn -B package

      - name: Checksum the JAR
        run: sha256sum target/java-svc-0.1.0-SNAPSHOT.jar

      - name: Show the local repository after the build
        run: du -sh ~/.m2/repository
      
      - name: Upload the JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-svc-jar
          path: services/java-svc/target/java-svc-0.1.0-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: services/java-svc/target/surefire-reports
          retention-days: 7
          if-no-files-found: error

  java-verify:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - name: Download the JAR built by java job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-svc-jar
          path: dist

      - name: Inspect the JAR
        run: |
          ls -la dist
          sha256sum dist/*.jar
          unzip -l dist/*.jar