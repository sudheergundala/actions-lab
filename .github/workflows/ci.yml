name: ci
on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci.yml"]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: services/python-svc
    steps:
      - uses: actions/checkout@v5
      
      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: install dependencies exactly as locked
        run: uv sync --locked

      - name: Show the python version
        run: uv run python --version

      - name: Run tests
        run: uv run pytest -q


  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-svc

    steps:
      - uses: actions/checkout@v5

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: services/node-svc/.nvmrc

      - name: Install Dependencies exactly as locked
        run: npm ci

      - name: Show the Node version
        run: node --version

      - name: Run tests
        run: npm test


  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/java-svc
    steps:
      - uses: actions/checkout@v5

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Show JDK version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build and Test
        run: mvn -B test